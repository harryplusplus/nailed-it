# LiteLLM proxy config for Hindsight
#
# Environment variables required:
#   CROF_API_KEY              — CrofAI API key
#   LANGFUSE_PUBLIC_KEY       — Langfuse hindsight project public key
#   LANGFUSE_SECRET_KEY       — Langfuse hindsight project secret key
#   LANGFUSE_OTEL_HOST        — Langfuse OTLP endpoint (self-hosted: http://localhost:3000)

# Run: uvx --python 3.13 litellm --config config.yaml --port 4000 --host 127.0.0.1
# From: ~/.ll-hs/

model_list:
  - model_name: glm-5.1-precision
    litellm_params:
      model: openai/glm-5.1-precision
      api_base: https://crof.ai/v1
      api_key: os.environ/CROF_API_KEY

litellm_settings:
  callbacks: [langfuse_otel]
